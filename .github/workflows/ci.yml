name: MATLAB Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          # Add toolboxes as later phases need them, e.g.:
          # products: Aerospace_Toolbox
          release: latest

      - name: Run tests
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: src/utils
          select-by-folder: tests
